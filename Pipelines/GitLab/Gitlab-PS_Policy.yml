# Definição dos stages
stages:
    - Veracode_Package
    - Veracode_Deps_IaC
    - Veracode_Scan

# Cria o ZIP com os arquivos conforme a documentação da Veracode
packaging:
    image: ubuntu:24.04
    stage: Veracode_Package

    before_script:
        - apt-get update
        - apt-get install -y zip

    script:
        - |
          zip -r veracode.zip . \
            -i '*.py' '*.html' '*.htm' '*.asp' '*.cjs' '*.css' '*.ehtml' '*.es' '*.es6' '*.handlebars' '*.hbs' '*.hjs' '*.js' '*.jsx' '*.json' '*.jsp' '*.jspx' '*.java' '*.map' '*.mjs' '*.mustache' '*.ts' '*.tsx' '*.vue' '*.xhtml' '*.lock' '*.module' '*.inc' '*.profile' '*.install' '*.engine' '*.theme' '*.php' '*.php4' '*.php5' '*.php7' '*.phtml' '*.txt' 'pyproject.toml' 'Pipfile' \
            -x 'node_modules/*' '*/node_modules/*' '.git/*' '*/.git/*' 'dist/*' '*/dist/*' '*test*' '*Test*' '*TEST*' '*teste*' '*Teste*' '*TESTE*'

    artifacts:
        paths:
            - veracode.zip


# Utiliza o SCA para fazer a análise de componentes de terceiros
sca:
    image: openjdk:8
    stage: Veracode_Deps_IaC
    when: always

    script:
        - |
          curl -sSL 'https://download.sourceclear.com/ci.sh' \
            | bash -s scan --update-advisor --allow-dirty


# Utiliza o Veracode IaC para analisar infraestrutura como codigo
Veracode_IaC:
    image: maven:3.9.9-eclipse-temurin-21
    stage: Veracode_Deps_IaC
    needs: []
    when: always
    allow_failure: true

    script:
        - curl -fsS https://tools.veracode.com/veracode-cli/install | sh
        - |
          export VERACODE_API_KEY_ID="${VeracodeID}"
          export VERACODE_API_KEY_SECRET="${VeracodeKey}"

          ORIGINAL_DIR="${CI_PROJECT_DIR:-$(pwd)}"
          PARENT_DIR="$(dirname "$ORIGINAL_DIR")"
          ORIGINAL_NAME="$(basename "$ORIGINAL_DIR")"
          PIPELINE_DIR="${CI_PROJECT_NAME}"

          restore_project_dir() {
            cd "$PARENT_DIR"
            if [ "$ORIGINAL_NAME" != "$PIPELINE_DIR" ] && [ -d "$PIPELINE_DIR" ]; then
              mv "$PIPELINE_DIR" "$ORIGINAL_NAME"
            fi
          }
          trap restore_project_dir EXIT

          cd "$PARENT_DIR"
          if [ "$ORIGINAL_NAME" != "$PIPELINE_DIR" ]; then
            mv "$ORIGINAL_NAME" "$PIPELINE_DIR"
          fi
          cd "$PIPELINE_DIR"
          echo "pasta:$(pwd)"

          ./veracode scan --type directory --source "$(pwd)" --format table

          restore_project_dir
          trap - EXIT


# Inicia a análise SAST/SCA por meio do Wrapper
Veracode_UploadAndScan:
    image: veracode/api-wrapper-java
    stage: Veracode_Scan

    script:
        - |
          java -jar /opt/veracode/api-wrapper.jar \
            -action UploadAndScan \
            -vid "${VeracodeID}" \
            -vkey "${VeracodeKey}" \
            -appname "${CI_PROJECT_NAME}" \
            -createprofile true \
            -autoscan true \
            -criticality VeryHigh \
            -filepath veracode.zip \
            -version "${CI_JOB_ID}"

    dependencies:
        - packaging


# Utiliza o Pipeline Scan para uma análise mais rápida
# e validar quebra por erros encontrados
pipeline_scan:
    image: openjdk:8
    stage: Veracode_Scan

    dependencies:
        - packaging

    when: always

    script:
        # Download do Pipeline Scan
        - |
          curl -sSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip pipeline-scan-LATEST.zip pipeline-scan.jar

        # Download da Policy
        - |
          java -jar pipeline-scan.jar \
            --veracode_api_id "${VeracodeID}" \
            --veracode_api_key "${VeracodeKey}" \
            --request_policy "${VeracodePolicyName}"

        # Normaliza o nome da Policy
        - |
          VeracodePolicyFile=$(echo "${VeracodePolicyName}" | sed 's/ /_/g')
          VeracodePolicyFile="${VeracodePolicyFile}.json"

        # Executa o Pipeline Scan utilizando a Policy
        - |
          java -jar pipeline-scan.jar \
            --veracode_api_id "${VeracodeID}" \
            --veracode_api_key "${VeracodeKey}" \
            --file veracode.zip \
            --gl_issue_generation true \
            --issue_details true \
            --policy_file "${VeracodePolicyFile}"
